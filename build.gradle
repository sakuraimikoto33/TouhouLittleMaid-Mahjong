plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.95'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Loaded only by the automated game-test run, excluded from the distributable jar.
sourceSets {
    gameTest {
        java.setSrcDirs(['src/gametest/java'])
        resources.setSrcDirs(['src/gametest/resources'])
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = neo_version
    addModdingDependenciesTo(sourceSets.gameTest)

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        // A separate development group includes tests only in the GameTest run.
        "${mod_id}_tests" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gameTest
        }
    }

    runs {
        configureEach {
            gameDirectory = project.file('run/1.21.1')
            systemProperty 'forge.logging.console.level', 'info'
            loadedMods = [mods[mod_id]]
        }

        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest/1.21.1')
            sourceSet = sourceSets.gameTest
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            loadedMods = [mods["${mod_id}_tests"]]
        }
    }
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev'
        content { includeGroup 'dev.architectury' }
    }
    mavenCentral()
}

dependencies {
    implementation "maven.modrinth:aUlSzMQ4:${riichi_mahjong_version}"
    implementation "maven.modrinth:R0bDWFAW:${touhou_little_maid_version}"
    implementation "dev.architectury:architectury-neoforge:${architectury_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('processResources', ProcessResources).configure {
    def properties = [
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_license: mod_license,
        minecraft_version: minecraft_version,
        neo_version_range: neo_version_range,
        touhou_little_maid_version_range: touhou_little_maid_version_range,
        riichi_mahjong_version_range: riichi_mahjong_version_range
    ]
    inputs.properties properties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand properties
    }
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
        'Specification-Title': mod_id,
        'Specification-Version': mod_version,
        'Implementation-Title': mod_name,
        'Implementation-Version': mod_version
    ])
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
