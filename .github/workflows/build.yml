name: Build and Release

on:
  push:
    branches:
      - "mc/**"
  workflow_dispatch:
    inputs:
      force_build:
        description: Build and evaluate a release without source changes
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  changes:
    name: Inspect pushed commits or force a manual build
    if: github.event_name == 'workflow_dispatch' || github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mod_changed: ${{ steps.force.outputs.mod_changed || steps.detect.outputs.mod_changed }}
      commits_scanned: ${{ steps.force.outputs.commits_scanned || steps.detect.outputs.commits_scanned }}

    steps:
      - name: Record forced manual build
        id: force
        if: github.event_name == 'workflow_dispatch' && inputs.force_build
        shell: bash
        run: |
          echo "mod_changed=true" >> "$GITHUB_OUTPUT"
          echo "commits_scanned=0" >> "$GITHUB_OUTPUT"
          echo "## Forced manual build" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout complete pushed history
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.after }}
          fetch-depth: 0
          fetch-tags: false

      - name: Detect mod changes across the push
        id: detect
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          API_URL: ${{ github.api_url }}
          SERVER_URL: ${{ github.server_url }}
        run: >-
          python3 .github/scripts/detect_mod_changes.py
          --before "$BEFORE_SHA"
          --after "$AFTER_SHA"
          --fetch-missing-before origin
          --github-output "$GITHUB_OUTPUT"
          --github-step-summary "$GITHUB_STEP_SUMMARY"
          --github-repository "$REPOSITORY"
          --github-ref-name "$BRANCH_NAME"
          --github-api-url "$API_URL"
          --github-server-url "$SERVER_URL"
          --github-token-env GITHUB_TOKEN

  build:
    name: Build ${{ github.ref_name }}
    needs: changes
    if: >-
      startsWith(github.ref, 'refs/heads/mc/') &&
      needs.changes.outputs.mod_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}

    steps:
      - name: Checkout pushed branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Test automation helpers
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: >-
          ./gradlew --no-daemon
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          build

      - name: Collect distribution artifact
        id: artifact
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: >-
          python3 .github/scripts/collect_artifact.py
          --branch "$BRANCH_NAME"
          --sha "$GITHUB_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: release-artifacts/*.jar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Release ${{ github.ref_name }} when version increases
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout pushed commit and tags
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Refresh release tags
        run: git fetch --force --tags origin

      - name: Decide whether to release
        id: decision
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: >-
          python3 .github/scripts/release_version.py
          --github-output "$GITHUB_OUTPUT"
          --repository "$GH_REPO"
          --target "$TARGET_SHA"

      - name: Report skipped release
        if: steps.decision.outputs.should_release != 'true'
        shell: bash
        env:
          MOD_VERSION: ${{ steps.decision.outputs.mod_version }}
          PREVIOUS_TAG: ${{ steps.decision.outputs.previous_tag }}
        run: |
          if [[ -n "$PREVIOUS_TAG" ]]; then
            echo "::notice::Release skipped: mod_version $MOD_VERSION is not newer than $PREVIOUS_TAG."
          else
            echo "::notice::Release skipped for mod_version $MOD_VERSION."
          fi

      - name: Download release asset
        if: steps.decision.outputs.should_release == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-assets

      - name: Create release
        if: steps.decision.outputs.should_release == 'true'
        shell: bash
        env:
          CANDIDATE_TAG: ${{ steps.decision.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=(release-assets/*.jar)
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No release assets were downloaded."
            exit 1
          fi

          # Close the race between the initial decision and release creation.
          git fetch --force --tags origin
          recheck_output="$RUNNER_TEMP/release-recheck.out"
          : > "$recheck_output"
          python3 .github/scripts/release_version.py \
            --github-output "$recheck_output" \
            --repository "$GH_REPO" \
            --target "$TARGET_SHA" \
            --release-notes release-notes.md

          if ! grep -Fxq 'should_release=true' "$recheck_output"; then
            echo "::notice::Release skipped because a same or newer version was published while this workflow was running."
            exit 0
          fi

          tag="$(sed -n 's/^tag=//p' "$recheck_output")"
          prerelease="$(sed -n 's/^prerelease=//p' "$recheck_output")"
          history_url="$(sed -n 's/^history_url=//p' "$recheck_output")"
          if [[ "$tag" != "$CANDIDATE_TAG" || -z "$history_url" \
            || ! -s release-notes.md ]]; then
            echo "::error::Release metadata changed unexpectedly during the final check."
            exit 1
          fi

          release_args=(
            "$tag"
            "${assets[@]}"
            --title "$tag"
            --target "$TARGET_SHA"
            --notes-file release-notes.md
          )
          if [[ "$prerelease" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          set +e
          create_output="$(gh release create "${release_args[@]}" 2>&1)"
          create_status=$?
          set -e
          if (( create_status != 0 )); then
            if gh release view "$tag" --repo "$GH_REPO" > /dev/null 2>&1; then
              echo "::notice::Release $tag was created concurrently by another workflow."
              exit 0
            fi
            printf '%s\n' "$create_output" >&2
            exit "$create_status"
          fi

          printf '%s\n' "$create_output"
