modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''Let nearby Touhou Little Maid maids join Riichi Mahjong games using the existing bot AI.'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="touhou_little_maid"
type="required"
versionRange="${touhou_little_maid_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="riichi_mahjong"
type="required"
versionRange="${riichi_mahjong_version_range}"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="touhou_little_maid_mahjong.mixins.json"
